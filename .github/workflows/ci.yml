# Adapted from Netvrio (sandysunny99/razorpay-ai-risk-manager @98bbc09) .github/workflows/ci.yml — Flask/pytest commands.
name: ci

on:
  push:
    branches: [main, hardening-llm, ui-redesign]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt pip-audit==2.9.0
      - name: Lint
        run: ruff check crosspay tests model app.py --select E,F,W --ignore E501,E402
      - name: Tests (no network, FX mocked, AI faked)
        env:
          CROSSPAY_ENV: test
          LLM_ENABLED: "0"
        run: pytest -q -m "not live_redteam" --cov=crosspay --cov-fail-under=75
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    # Builds the production image and checks that the container starts and answers its health check.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crosspay:ci .
      - name: Start container (throwaway CI-only secrets, AI off)
        run: |
          docker run -d --name crosspay -p 8000:8000 \
            -e SECRET_KEY=ci-only-not-a-real-secret \
            -e LEDGER_SIGNING_KEY=ci-only-not-a-real-key \
            -e LLM_ENABLED=0 -e DEMO_MODE=0 \
            crosspay:ci
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then echo; echo "healthy after ${i} tries"; exit 0; fi
            sleep 2
          done
          docker logs crosspay
          exit 1
      - name: Container runs as non-root
        run: test "$(docker exec crosspay id -u)" != "0"
