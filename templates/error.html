{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:48px auto;text-align:center;">
    <h1 style="font-size:2rem;font-weight:800;">{{ code }}</h1>
    <p style="color:var(--text-muted);margin:8px 0 20px;">{{ message }}</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Back to home</a>
</div>
{% endblock %}
